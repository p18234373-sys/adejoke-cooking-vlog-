<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adejoke Cooking Vlog — Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><b>Adejoke Cooking Vlog</b><span>Restaurant Admin</span></header><main><section id="loginBox" class="panel"><h1>Restaurant Admin</h1><p>Sign in with your approved restaurant email and admin password.</p><form id="loginForm"><input id="loginEmail" type="email" required placeholder="Admin email"><input id="loginPassword" type="password" required placeholder="Admin password"><button class="btn">Sign in</button></form><p id="loginMsg"></p></section><section id="app" hidden><div class="top"><div><h1>Orders</h1><p id="who"></p></div><div><button class="btn" onclick="loadOrders()">Refresh</button> <button class="btn" onclick="logout()">Log out</button></div></div><section class="panel owner"><h2>Approve another admin</h2><p>Owner accounts can add a friend's email.</p><div class="row"><input id="adminEmail" type="email" placeholder="Friend's email"><button class="btn" onclick="addAdmin()">Approve email</button></div><p id="setupMsg"></p></section><div id="orders"></div></section></main><script src="/admin/admin.js"></script></body></html>
