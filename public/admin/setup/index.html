<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Admin Setup</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><b>Adejoke Cooking Vlog</b><span>Owner Setup</span></header><main><section class="panel"><h1>Approve your friend's admin account</h1><p>This page is for the Hatchable project owner. Enter the email your friend will use to sign in to the restaurant admin.</p><input id="email" type="email" placeholder="Friend's email" style="width:100%;padding:12px;border:1px solid #ddc8b5;border-radius:8px"><br><br><button class="btn" onclick="save()">Approve admin</button><p id="msg"></p></section></main><script>async function save(){const email=document.getElementById('email').value.trim();const r=await fetch('/api/admin/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json().catch(()=>({}));document.getElementById('msg').textContent=r.ok?'Approved '+email:(d.error||'Not authorized. Make sure you are signed into Hatchable as the project owner.')}</script></body></html>
